<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button</title>
</head>
 <style>
    button{
        padding: 25px;
        border: 1px solid black;
        width: 200px;
        font-size: 20px;
        color: black;
        font-weight: bold;
        border-radius: 10px;
        background-color: rgb(76, 0, 255);
        cursor: pointer;
        



        



    }
    button:hover{
        background-color: red ;

    }
    
    button:active{
        background-color: aqua;
    }

 </style>
<body>
    
    <button>Click Me</button>
    
</body>
</html>
