
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Spacing Exercise</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #808080;
        }

        .container {
            margin: 13px 16px;
            padding: 32px 100px;
            background-color: #808080;
        }

        .card {
            background-color: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 12px;
        }

        .card p {
            margin: 16px 0;
            line-height: 1.4;
        }

        .btn {
            display: inline-block;
            padding: 10px 12px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            color: white;
        }

        .btn-teal {
            background-color: #008b8b;
        }

        .btn-orange {
            background-color: orange;
            color: black;
        }

        .btn-purple {
            background-color: purple;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="card">
            <p>
                Keep track of daily activities can boost productivity
                and, thus, reduce anxiety.
            </p>
            <a href="#" class="btn btn-teal">Read more </a>
        </div>

        <div class="card">
            <p>
                Have a roadmap, reducing distractions, overwhelm or stress
            </p>
            <a href="#" class="btn btn-orange">Read more </a>
        </div>

        <div class="card">
            <p>
                Write a to-do list to give you significant control over
                how your day will look
            </p>
            <a href="#" class="btn btn-purple">Read more </a>
        </div>

    </div>
</body>
</html>
