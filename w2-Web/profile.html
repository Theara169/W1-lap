
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 450px;
            max-width: 90%;
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3498db;
        }

        h2 {
            margin-bottom: 8px;
            color: #222;
        }

        .job {
            color: #3498db;
            margin-top: 0;
            font-weight: bold;
        }

        table {
            width: 100%;
            margin: 25px 0;
            border-collapse: collapse;
        }

        th {
            color: #666;
            font-size: 14px;
            padding-bottom: 10px;
        }

        td {
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }

        .description {
            color: #666;
            line-height: 1.7;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .profile-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .profile-btn:hover {
            background-color: #2176ae;
        }
    </style>
</head>

<body>

    <div class="card">

        <img
            class="profile-img"
            src="https://res.cloudinary.com/t6wyjwqt/image/upload/v1787711776/samples/man-portrait.jpg"
            alt="Keo Theara profile picture"
        >

        <h2>Keo Theara</h2>
        <p class="job">Full-stack Developer</p>

        <table>
            <tr>
                <th>Projects</th>
                <th>Following</th>
                <th>Followers</th>
            </tr>

            <tr>
                <td>17</td>
                <td>159</td>
                <td>205</td>
            </tr>
        </table>

        <p class="description">
            I am a passionate Computer Science student specializing
            in Data Science and Full-Stack Development.
        </p>

        <a href="profile.html" class="profile-btn">
            View My Profile
        </a>

    </div>

</body>
</html>
